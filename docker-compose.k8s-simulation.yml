version: "3.8"

services:
  # Container do Vosk Kaldi ASR: provê a pilha de rede compartilhada (Padrão Pod K8s)
  vosk-asr:
    image: alphacep/kaldi-vosk-server:latest
    container_name: sim-vosk-asr
    restart: unless-stopped
    command: python3 /opt/vosk-server/websocket/asr_server.py /opt/vosk-model/model
    volumes:
      - ./vosk-model:/opt/vosk-model/model:ro
    environment:
      - VOSK_SAMPLE_RATE=8000
    ports:
      - "2700:2700" # Vosk WebSocket ASR
      - "2801:2801" # Classificator Engine HTTP/Health/WS
      - "9092:9092" # Asterisk AudioSocket TCP Nativo
    networks:
      - sim_network

  # Classificator Engine (Go): roda no mesmo namespace de rede que o Vosk (Loopback 127.0.0.1:2700)
  classificator-engine:
    build:
      context: .
      dockerfile: Dockerfile.classificator
      target: engine
    container_name: sim-classificator-engine
    restart: unless-stopped
    network_mode: "service:vosk-asr"
    environment:
      - PORT=2801
      - AUDIOSOCKET_PORT=9092
      - VOSK_SERVER_URL=ws://127.0.0.1:2700
      - VOSK_MAX_DURATION_SEC=3.5
      - REDIS_ADDR=dialer-redis:6379
      - MAX_CONCURRENT_SESSIONS=40
    depends_on:
      - vosk-asr
      - dialer-redis

  # Cache Redis 7 para Metadados e CDRs
  dialer-redis:
    image: redis:7-alpine
    container_name: sim-dialer-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6379:6379"
    networks:
      - sim_network

  # Asterisk PBX com volume de gravação montado em RAM (tmpfs 1GB) para eliminar I/O blocking
  asterisk:
    image: andrius/asterisk:20
    container_name: sim-asterisk
    restart: unless-stopped
    tmpfs:
      - /var/spool/asterisk/monitor:size=1G,mode=1777
    volumes:
      - ./mode/dialer/extensions.conf:/etc/asterisk/extensions.conf:ro
    ports:
      - "5038:5038" # AMI
      - "5060:5060/udp" # SIP UDP
      - "5060:5060/tcp" # SIP TCP
    networks:
      - sim_network
    depends_on:
      - vosk-asr
      - dialer-redis

networks:
  sim_network:
    driver: bridge

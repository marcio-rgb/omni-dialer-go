      - REDIS_ADDR=dialer-redis:6379
      - REDIS_DB=0
      - ASTERISK_AMI_HOST=asterisk
      - ASTERISK_AMI_PORT=5038
      - ASTERISK_AMI_USER=Omnichat
      - ASTERISK_AMI_PASS=ypnqYP7EHNtYFkqww23243rwew423
      - VOSK_SERVER_URL=ws://dialer-vosk:2700
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=creditobr
      - MINIO_SECRET_KEY=56DNM25InI73qoYI4nb9
      - MINIO_BUCKET=mailings

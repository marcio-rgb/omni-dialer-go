[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[pre-dial-vivo]
exten => s,1,NoOp(Pre-dial handler configurando identificador de chamada)
 same => n,Set(TRUNK_ID=${IF($[ "${TRUNK_NAME}" = "" ]?1127011340:${TRUNK_NAME})})
 same => n,Set(CALLERID(num)=${TRUNK_ID})
 same => n,Set(CALLERID(name)=${TRUNK_ID})
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)="${TRUNK_ID}" <sip:${TRUNK_ID}@metapabx.vivo.net.br>)
 same => n,ExecIf($[ "${TRUNK_USER_AGENT}" != "" ]?Set(PJSIP_HEADER(add,User-Agent)=${TRUNK_USER_AGENT}))
 same => n,Return()

[outbound-vivo]
exten => _X.,1,NoOp(Discagem saint via Vivo: ${EXTEN} - Tronco: ${TRUNK_NAME})
 same => n,Set(TRUNK_ID=${IF($[ "${TRUNK_NAME}" = "" ]?1127011340:${TRUNK_NAME})})
 same => n,Dial(PJSIP/${TRUNK_ID}/sip:${EXTEN}@metapabx.vivo.net.br,45,b(pre-dial-vivo^s^1))
 same => n,Hangup()

[cos-all]
; Roteamento para LiveKit SIP Trunk
exten => 9999,1,NoOp(Roteando para LiveKit SIP Trunk: sala=${AGENT_ROOM})
 same => n,Set(AGENT_ROOM=${IF($[ "${AGENT_ROOM}" = "" ]?default_room:${AGENT_ROOM})})
 same => n,Dial(PJSIP/livekit-sip/sip:${AGENT_ROOM}@192.168.0.28:5060,60)
 same => n,Hangup()

exten => _X.,1,NoOp(Chamada saint: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()

[cos-all-custom]
exten => 9999,1,NoOp(Roteando para LiveKit SIP Trunk em cos-all-custom: sala=${AGENT_ROOM})
 same => n,Set(AGENT_ROOM=${IF($[ "${AGENT_ROOM}" = "" ]?default_room:${AGENT_ROOM})})
 same => n,Dial(PJSIP/livekit-sip/sip:${AGENT_ROOM}@192.168.0.28:5060,60)
 same => n,Hangup()

; Contexto padrão chamado pelo Dialer-Go para triagem
[from-dialer-amd]
exten => s,1,Goto(triagem-amd,s,1)

; Contexto de Triagem e AMD Hibrido de Alta Precisao (100% Go-lang + Vosk STT)
; Regra de Ouro: Captura o "Alo" do cliente e NUNCA derruba chamadas humanas validas
[triagem-amd]
exten => s,1,NoOp(--- INICIANDO TRIAGEM AMD PREDITIVA PARA: ${PHONE} (Lead: ${LEAD_ID}) ---)
 same => n,Answer()
 same => n,Set(REC_FILENAME=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y/%m/%d)}/${STRFTIME(${EPOCH},,%H%M%S)}-PRED-${PHONE}-${UNIQUEID})
 same => n,MixMonitor(${REC_FILENAME}.wav,b)
 same => n,GotoIf($["${BYPASS_VOSK}" = "1"]?humano)

 ; 1. Execucao de AMD Nativo Passivo (Ouve a saudacao natural "Alo" imediatamente no atendimento - max 2s)
 same => n,AMD(1500,1200,500,2000,100,50,3,256)
 same => n,NoOp(AMD Nativo: Status=${AMDSTATUS}, Causa=${AMDCAUSE})

 ; 2. Se o AMD confirmou Humano ou NOTSURE (duvida/silencio), transfere imediatamente para o operador
 same => n,GotoIf($["${AMDSTATUS}" = "HUMAN"]?humano)
 same => n,GotoIf($["${AMDSTATUS}" = "NOTSURE"]?humano)

 ; 3. Somente se o AMD suspeitar de MACHINE, executa Vosk STT para confirmacao e evitar falso positivo
 same => n(analise_vosk),NoOp(AMD suspeita de Maquina (${AMDSTATUS}/${AMDCAUSE}). Validando com Vosk STT...)
 same => n,EAGI(/var/lib/asterisk/agi-bin/vosk-eagi)
 same => n,NoOp(Vosk STT Go: Status=${VOSK_AMD_STATUS}, Causa=${VOSK_AMD_CAUSE}, Texto='${VOSK_AMD_TEXT}')

 ; Se o Vosk confirmou inequivocamente Caixa Postal / Mensagem de Operadora, desliga
 same => n,GotoIf($["${VOSK_AMD_STATUS}" = "MACHINE"]?caixa_postal)

 ; Em todos os demais casos (Humano confirmado, fala normal, ou fallback de seguranca): trata como HUMANO
 same => n,Goto(humano)

 same => n(caixa_postal),NoOp(Caixa postal / Atendimento automatico confirmado pelo Vosk STT. Desligando.)
 same => n,Hangup()

 same => n(humano),NoOp(=== HUMANO CONFIRMADO! Notificando discador via UserEvent ===)
 same => n,ExecIf($["${IS_AI_CALL}" = "1"]?UserEvent(PredictiveAi,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Phone: ${PHONE},LeadId: ${LEAD_ID},CampaignId: ${CAMPAIGN_ID}):UserEvent(PredictiveHuman,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Phone: ${PHONE},LeadId: ${LEAD_ID},CampaignId: ${CAMPAIGN_ID}))
 same => n,Wait(30)
 same => n,Hangup()

; ====================================================================
; CONTEXTO DE ENTREGA DE CHAMADA MANUAL AO OPERADOR / SALA LIVEKIT
; Chamado pelo Dialer-Go via Originate quando o cliente atende
; ====================================================================
[from-dialer-manual]
exten => s,1,NoOp(=== CHAMADA MANUAL ATENDIDA (${CALL_ID}) PARA O OPERADOR: ${AGENT_ID} ===)
 same => n,Set(REC_FILENAME=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y/%m/%d)}/${STRFTIME(${EPOCH},,%H%M%S)}-MANUAL-${PHONE}-${UNIQUEID})
 same => n,MixMonitor(${REC_FILENAME}.wav)
 same => n,NoOp(Conectando a perna do cliente a rota SIP do operador: ${SIP_ROUTE})
 same => n,Dial(${SIP_ROUTE},60)
 same => n,Hangup()

exten => _X.,1,Goto(s,1)

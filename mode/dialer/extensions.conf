[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[pre-dial-vivo]
exten => s,1,NoOp(Pre-dial handler configurando identificador de chamada)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(TRUNK_ID=${IF($[ "${TRUNK_NAME}" = "" ]?1127011340:${TRUNK_NAME})})
 same => n,Set(CALLERID(num)=${TRUNK_ID})
 same => n,Set(CALLERID(name)=${TRUNK_ID})
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)="${TRUNK_ID}" <sip:${TRUNK_ID}@metapabx.vivo.net.br>)
 same => n,ExecIf($[ "${TRUNK_USER_AGENT}" != "" ]?Set(PJSIP_HEADER(add,User-Agent)=${TRUNK_USER_AGENT}))
 same => n,Return()

[outbound-vivo]
exten => _X.,1,NoOp(Discagem saint via Vivo: ${EXTEN} - Tronco: ${TRUNK_NAME})
 same => n,Set(TRUNK_ID=${IF($[ "${TRUNK_NAME}" = "" ]?1127011340:${TRUNK_NAME})})
 same => n,Dial(PJSIP/${TRUNK_ID}/sip:${EXTEN}@metapabx.vivo.net.br,45,b(pre-dial-vivo^s^1))
 same => n,Hangup()

[predial-livekit-headers]
exten => s,1,NoOp(--- INJETANDO CABECALHOS SIP PARA LIVEKIT ---)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(P_PHONE=${IF($[ "${ARG1}" != "" ]?${ARG1}:${PHONE})})
 same => n,Set(P_NAME=${IF($[ "${ARG2}" != "" ]?${ARG2}:${LEAD_NAME})})
 same => n,Set(P_CPF=${IF($[ "${ARG3}" != "" ]?${ARG3}:${LEAD_CPF})})
 same => n,Set(P_CAMP=${IF($[ "${ARG4}" != "" ]?${ARG4}:${CAMPAIGN_ID})})
 same => n,Set(P_CUST_ID=${IF($[ "${CUSTOMER_ID}" != "" ]?${CUSTOMER_ID}:${P_CPF})})
 same => n,Set(P_CUST_NAME=${IF($[ "${CUSTOMER_NAME}" != "" ]?${CUSTOMER_NAME}:${P_NAME})})
 same => n,Set(P_CUST_PHONE=${IF($[ "${CUSTOMER_PHONE}" != "" ]?${CUSTOMER_PHONE}:${P_PHONE})})
 same => n,Set(P_CUST_ATT1=${IF($[ "${CUSTOMER_ATT1}" != "" ]?${CUSTOMER_ATT1}:${ATT1})})
 same => n,Set(P_CUST_ATT2=${IF($[ "${CUSTOMER_ATT2}" != "" ]?${CUSTOMER_ATT2}:${ATT2})})
 same => n,Set(P_CUST_ATT3=${IF($[ "${CUSTOMER_ATT3}" != "" ]?${CUSTOMER_ATT3}:${ATT3})})
 same => n,ExecIf($[ "${P_CUST_ID}" != "" ]?Set(PJSIP_HEADER(add,X-Customer-ID)=${P_CUST_ID}))
 same => n,ExecIf($[ "${P_CUST_NAME}" != "" ]?Set(PJSIP_HEADER(add,X-Customer-Name)=${P_CUST_NAME}))
 same => n,ExecIf($[ "${P_CUST_PHONE}" != "" ]?Set(PJSIP_HEADER(add,X-Customer-Phone)=${P_CUST_PHONE}))
 same => n,ExecIf($[ "${P_CUST_ATT1}" != "" ]?Set(PJSIP_HEADER(add,X-Customer-Att1)=${P_CUST_ATT1}))
 same => n,ExecIf($[ "${P_CUST_ATT2}" != "" ]?Set(PJSIP_HEADER(add,X-Customer-Att2)=${P_CUST_ATT2}))
 same => n,ExecIf($[ "${P_CUST_ATT3}" != "" ]?Set(PJSIP_HEADER(add,X-Customer-Att3)=${P_CUST_ATT3}))
 same => n,ExecIf($[ "${P_PHONE}" != "" ]?Set(PJSIP_HEADER(add,X-Lead-Phone)=${P_PHONE}))
 same => n,ExecIf($[ "${P_NAME}" != "" ]?Set(PJSIP_HEADER(add,X-Lead-Name)=${P_NAME}))
 same => n,ExecIf($[ "${P_CPF}" != "" ]?Set(PJSIP_HEADER(add,X-Lead-CPF)=${P_CPF}))
 same => n,ExecIf($[ "${P_CAMP}" != "" ]?Set(PJSIP_HEADER(add,X-Campaign-Id)=${P_CAMP}))
 same => n,ExecIf($[ "${P_NAME}" != "" ]?Set(CALLERID(name)=${P_NAME}))
 same => n,ExecIf($[ "${P_PHONE}" != "" ]?Set(CALLERID(num)=${P_PHONE}))
 same => n,Return()


[cos-all]
; Roteamento dinâmico para LiveKit SIP Trunk: retorna para o IP que chamou
exten => 9999,1,NoOp(--- ROTEAMENTO LIVEKIT SIP: sala=${AGENT_ROOM} ---)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(AGENT_ROOM=${IF($[ "${AGENT_ROOM}" = "" ]?default_room:${AGENT_ROOM})})
 same => n,Set(GROUP(livekit_rooms)=${AGENT_ROOM})
 same => n,GotoIf($[ ${GROUP_COUNT(${AGENT_ROOM}@livekit_rooms)} > 1 ]?room_busy)
 same => n,GotoIf($["${CALL_TYPE}" = "PREDICTIVE"]?dial_trunk)
 same => n,Set(CALLER_ADDR=${CHANNEL(pjsip,remote_addr)})
 same => n,Set(CALLER_IP=${CUT(CALLER_ADDR,:,1)})
 same => n,Set(CALLER_PORT=${CUT(CALLER_ADDR,:,2)})
 same => n,Set(CALLER_PORT=${IF($[ "${CALLER_PORT}" = "" ]?5060:${CALLER_PORT})})
 same => n,GotoIf($[ "${CALLER_IP}" != "" ]?dial_caller:dial_trunk)
 same => n(dial_caller),NoOp(Retornando chamada para o IP de origem que chamou: ${CALLER_IP}:${CALLER_PORT})
 same => n,Dial(PJSIP/livekit-sip/sip:${AGENT_ROOM}@${CALLER_IP}:${CALLER_PORT},60,b(predial-livekit-headers^s^1(${PHONE},${LEAD_NAME},${LEAD_CPF},${CAMPAIGN_ID})))
 same => n,Hangup()
 same => n(dial_trunk),NoOp(Roteando para endpoint livekit-sip)
 same => n,Dial(PJSIP/${AGENT_ROOM}@livekit-sip,60,b(predial-livekit-headers^s^1(${PHONE},${LEAD_NAME},${LEAD_CPF},${CAMPAIGN_ID})))
 same => n,Hangup()
 same => n(room_busy),NoOp(--- SALA LIVEKIT OCUPADA (${AGENT_ROOM}) - REJEITANDO CHAMADA CONCORRENTE ---)
 same => n,UserEvent(PredictiveRoomBusy,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Room: ${AGENT_ROOM})
 same => n,Hangup(17)

exten => _X.,1,NoOp(Chamada sainte: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},60)
 same => n,Hangup()

[cos-all-custom]
exten => 9999,1,NoOp(--- ROTEAMENTO LIVEKIT SIP (CUSTOM): sala=${AGENT_ROOM} ---)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(AGENT_ROOM=${IF($[ "${AGENT_ROOM}" = "" ]?default_room:${AGENT_ROOM})})
 same => n,Set(GROUP(livekit_rooms)=${AGENT_ROOM})
 same => n,GotoIf($[ ${GROUP_COUNT(${AGENT_ROOM}@livekit_rooms)} > 1 ]?room_busy)
 same => n,GotoIf($["${CALL_TYPE}" = "PREDICTIVE"]?dial_trunk)
 same => n,Set(CALLER_ADDR=${CHANNEL(pjsip,remote_addr)})
 same => n,Set(CALLER_IP=${CUT(CALLER_ADDR,:,1)})
 same => n,Set(CALLER_PORT=${CUT(CALLER_ADDR,:,2)})
 same => n,Set(CALLER_PORT=${IF($[ "${CALLER_PORT}" = "" ]?5060:${CALLER_PORT})})
 same => n,GotoIf($[ "${CALLER_IP}" != "" ]?dial_caller:dial_trunk)
 same => n(dial_caller),NoOp(Retornando chamada para o IP de origem que chamou: ${CALLER_IP}:${CALLER_PORT})
 same => n,Dial(PJSIP/livekit-sip/sip:${AGENT_ROOM}@${CALLER_IP}:${CALLER_PORT},60,b(predial-livekit-headers^s^1(${PHONE},${LEAD_NAME},${LEAD_CPF},${CAMPAIGN_ID})))
 same => n,Hangup()
 same => n(dial_trunk),NoOp(Roteando para endpoint livekit-sip)
 same => n,Dial(PJSIP/${AGENT_ROOM}@livekit-sip,60,b(predial-livekit-headers^s^1(${PHONE},${LEAD_NAME},${LEAD_CPF},${CAMPAIGN_ID})))
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?stress_wait)
 same => n,Hangup()
 same => n(stress_wait),NoOp(--- MODO SIMULADOR: Mantendo chamada humana conectada por 20s ---)
 same => n,Wait(20)
 same => n,Hangup()
 same => n(room_busy),NoOp(--- SALA LIVEKIT OCUPADA (${AGENT_ROOM}) - REJEITANDO CHAMADA CONCORRENTE ---)
 same => n,UserEvent(PredictiveRoomBusy,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Room: ${AGENT_ROOM})
 same => n,Hangup(17)


; Contexto de entrega da fila para agentes LiveKit via canais Local/
[livekit-agent-queue]
exten => _[a-zA-Z0-9_-].,1,NoOp(--- CONECTANDO AGENTE LIVEKIT DA FILA: ${EXTEN} ---)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Dial(PJSIP/${EXTEN}@livekit-sip,60,m(dialer_hold)b(predial-livekit-headers^s^1(${PHONE},${LEAD_NAME},${LEAD_CPF},${CAMPAIGN_ID})))
 same => n,Hangup()

; Contexto nativo de fila Asterisk (app_queue) com estratégia leastrecent e gravação desde o ms 0
[from-dialer-queue]
exten => s,1,NoOp(--- GRAVANDO DESDE O MS 0 E ENCAMINHANDO PARA QUEUE: Lead=${PHONE} Campanha=${CAMPAIGN_ID} ---)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(REC_FILENAME=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y/%m/%d)}/${STRFTIME(${EPOCH},,%H%M%S)}-PRED-${PHONE}-${UNIQUEID})
 same => n,Set(REC_FILE=${REC_FILENAME}.wav)
 same => n,MixMonitor(${REC_FILENAME}.tmp.wav,r(${REC_FILENAME}-rx.tmp.wav)t(${REC_FILENAME}-tx.tmp.wav)b,/var/lib/asterisk/agi-bin/merge-stereo "${REC_FILENAME}-tx.tmp.wav" "${REC_FILENAME}-rx.tmp.wav" "${REC_FILENAME}.wav")
 same => n,Answer()
 same => n,GotoIf($[ "${TRUNK_AMD_ENABLED}" != "1" ]?queue_connect)
 same => n,NoOp(--- TRONCO COM AMD HABILITADO: ACIONANDO TRIAGEM AUDIOSOCKET ---)
 same => n,Set(CALL_UUID=${IF($[ "${CALL_UUID}" != "" ]?${CALL_UUID}:${UNIQUEID})})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
 same => n,NoOp(--- RETORNO AUDIOSOCKET AMD: STATUS=${VOSK_AMD_STATUS} CAUSA=${VOSK_AMD_CAUSE} ---)
 same => n,GotoIf($[ "${VOSK_AMD_STATUS}" = "MACHINE" ]?voicemail_drop)
 same => n,UserEvent(PredictiveHuman,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Phone: ${PHONE},CampaignId: ${CAMPAIGN_ID},LeadId: ${LEAD_ID},Transcript: ${VOSK_TRANSCRIPTION})
 same => n(queue_connect),NoOp(--- CONECTANDO A FILA ASTERISK (LEAD HUMANO CONFIRMADO OU AMD BYPASS) ---)
 same => n,Set(CHANNEL(musicclass)=dialer_hold)
 same => n,Set(CHANNEL(musiconhold)=dialer_hold)
 same => n,Set(QUEUE_NAME=${IF($[ "${TENANT_ID}" != "" & "${CAMPAIGN_ID}" != "" ]?${TENANT_ID}-${CAMPAIGN_ID}:${IF($[ "${CAMPAIGN_ID}" != "" ]?q_${CAMPAIGN_ID}:dialer-default-queue)})})
 same => n,NoOp(Encaminhando chamada para Fila Asterisk: ${QUEUE_NAME} (timeout=15s, music=dialer_hold))
 same => n,Queue(${QUEUE_NAME},t,,,15)
 same => n,NoOp(Retorno da Fila: QUEUESTATUS=${QUEUESTATUS})
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT" | "${QUEUESTATUS}" = "FULL" | "${QUEUESTATUS}" = "JOINEMPTY"]?queue_abandon)
 same => n,Hangup()
 same => n(queue_abandon),NoOp(--- FILA TIMEOUT OU SEM OPERADOR: REGISTRANDO ABANDONO ---)
 same => n,UserEvent(QueueTimeoutAbandon,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Phone: ${PHONE},CampaignId: ${CAMPAIGN_ID},Queue: ${QUEUE_NAME})
 same => n,Hangup(17)
 same => n(voicemail_drop),NoOp(--- SECRETARIA ELETRONICA DETECTADA: DESLIGANDO IMEDIATAMENTE (ZERO HOLD/QUEUE) ---)
 same => n,UserEvent(PredictiveMachine,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Phone: ${PHONE},CampaignId: ${CAMPAIGN_ID},LeadId: ${LEAD_ID},Cause: ${VOSK_AMD_CAUSE})
 same => n,Hangup(16)

exten => h,1,NoOp(--- HANGUP DETECTADO EM QUEUE: DISPARANDO RECORDING FINISHED ---)
 same => n,ExecIf($[ "${REC_FILENAME}" != "" ]?UserEvent(RecordingFinished,Uniqueid: ${UNIQUEID},Channel: ${CHANNEL},RecordingFile: ${REC_FILENAME}.wav,Phone: ${PHONE},LeadId: ${LEAD_ID},CampaignId: ${CAMPAIGN_ID}))
 same => n,Hangup()

; Contexto padrão chamado pelo Dialer-Go para triagem / entrega LiveKit SIP
[from-dialer-amd]
exten => s,1,NoOp(--- INICIANDO ROTEAMENTO LIVEKIT SIP: Lead=${PHONE} Campanha=${CAMPAIGN_ID} ---)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(REC_FILENAME=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y/%m/%d)}/${STRFTIME(${EPOCH},,%H%M%S)}-PRED-${PHONE}-${UNIQUEID})
 same => n,Set(REC_FILE=${REC_FILENAME}.wav)
 same => n,MixMonitor(${REC_FILENAME}.tmp.wav,r(${REC_FILENAME}-rx.tmp.wav)t(${REC_FILENAME}-tx.tmp.wav)b,/var/lib/asterisk/agi-bin/merge-stereo "${REC_FILENAME}-tx.tmp.wav" "${REC_FILENAME}-rx.tmp.wav" "${REC_FILENAME}.wav")
 same => n,Answer()
 same => n,UserEvent(CallAnswered,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Phone: ${PHONE},LeadId: ${LEAD_ID},CampaignId: ${CAMPAIGN_ID})
 same => n,UserEvent(PredictiveHuman,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},Phone: ${PHONE},LeadId: ${LEAD_ID},CampaignId: ${CAMPAIGN_ID})
 same => n,Wait(20)
 same => n,Hangup()

exten => h,1,NoOp(--- HANGUP DETECTADO EM AMD/LIVEKIT: DISPARANDO RECORDING FINISHED ---)
 same => n,ExecIf($[ "${REC_FILENAME}" != "" ]?UserEvent(RecordingFinished,Uniqueid: ${UNIQUEID},Channel: ${CHANNEL},RecordingFile: ${REC_FILENAME}.wav,Phone: ${PHONE},LeadId: ${LEAD_ID},CampaignId: ${CAMPAIGN_ID}))
 same => n,Hangup()

[from-dialer-manual]
exten => s,1,NoOp(=== CHAMADA MANUAL ATENDIDA (${CALL_ID}) PARA O OPERADOR: ${AGENT_ID} ===)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,UserEvent(CallAnswered,Channel: ${CHANNEL},Uniqueid: ${UNIQUEID},CallId: ${CALL_ID})
 same => n,Set(REC_FILENAME=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y/%m/%d)}/${STRFTIME(${EPOCH},,%H%M%S)}-MANUAL-${PHONE}-${UNIQUEID})
 same => n,Set(REC_FILE=${REC_FILENAME}.wav)
 same => n,MixMonitor(${REC_FILENAME}.tmp.wav,r(${REC_FILENAME}-rx.tmp.wav)t(${REC_FILENAME}-tx.tmp.wav)b,/var/lib/asterisk/agi-bin/merge-stereo "${REC_FILENAME}-tx.tmp.wav" "${REC_FILENAME}-rx.tmp.wav" "${REC_FILENAME}.wav")
 same => n,NoOp(Conectando a perna do cliente a rota SIP do operador: ${SIP_ROUTE})
 same => n,Dial(${SIP_ROUTE},60,b(predial-livekit-headers^s^1(${PHONE},${LEAD_NAME},${LEAD_CPF},${CAMPAIGN_ID})))
 same => n,Hangup()

exten => h,1,NoOp(--- HANGUP DETECTADO EM MANUAL: DISPARANDO RECORDING FINISHED ---)
 same => n,ExecIf($[ "${REC_FILENAME}" != "" ]?UserEvent(RecordingFinished,Uniqueid: ${UNIQUEID},Channel: ${CHANNEL},RecordingFile: ${REC_FILENAME}.wav,Phone: ${PHONE},LeadId: ${LEAD_ID},CampaignId: ${CAMPAIGN_ID}))
 same => n,Hangup()

exten => failed,1,Hangup()
exten => _X.,1,Goto(s,1)

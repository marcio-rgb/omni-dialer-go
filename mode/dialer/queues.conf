[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
shared_lastcall = yes

; Template padrão para filas preditivas de campanha
[dialer-queue-template](!)
strategy = leastrecent
timeout = 15
wrapuptime = 0
ringinuse = no
joinempty = yes
leavewhenempty = no
reportholdtime = no
announce-holdtime = no
announce-frequency = 0
musicclass = dialer_hold
music = dialer_hold
queue-youarenext = dialer/vc_e_o_proximo
setinterfacevar = yes
setqueuevar = yes
setqueueentryvar = yes

; Fila global padrão
[dialer-default-queue](dialer-queue-template)

; Fila de fallback para campanhas dinâmicas
[q_default](dialer-queue-template)


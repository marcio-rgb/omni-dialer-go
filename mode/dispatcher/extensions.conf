[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Total de troncos Vivo configurados no escritório
VIVO_TRUNK_COUNT=60
; Limite de canais simultâneos por tronco Vivo (ajuste conforme contratado)
VIVO_CHANNELS_PER_TRUNK=30

; ==============================================================================
; PRE-DIAL HANDLER: INJEÇÃO DE CABEÇALHOS SIP E CALLERID DA VIVO
; ==============================================================================
[pre-dial-vivo]
exten => s,1,NoOp(--- CONFIGURANDO IDENTIFICADOR DO TRONCO: ${ARG1} ---)
 same => n,Set(TRUNK_NAME=${IF($[ "${ARG1}" != "" ]?${ARG1}:vivo_01)})
 same => n,Set(TRUNK_NUMBER=${GLOBAL(${TRUNK_NAME}_NUM)})
 same => n,Set(TRUNK_NUMBER=${IF($[ "${TRUNK_NUMBER}" != "" ]?${TRUNK_NUMBER}:1127011340)})
 same => n,Set(CALLERID(num)=${TRUNK_NUMBER})
 same => n,Set(CALLERID(name)=${TRUNK_NUMBER})
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)="${TRUNK_NUMBER}" <sip:${TRUNK_NUMBER}@metapabx.vivo.net.br>)
 same => n,Return()

; ==============================================================================
; CONTEXTO PRINCIPAL: RECEBE DA VPS E DISTRIBUI EM ROUND-ROBIN NOS 60 TRONCOS
; ==============================================================================
[from-vps]
exten => _X.,1,NoOp(=== [DISPATCHER GATEWAY] RECEBIDA CHAMADA DA VPS: ${EXTEN} ===)
 same => n,Set(TRY_COUNT=0)

 same => n(next_trunk),Set(TRY_COUNT=$[ ${TRY_COUNT} + 1 ])
 same => n,GotoIf($[ ${TRY_COUNT} > ${VIVO_TRUNK_COUNT} ]?all_busy)

 ; Incrementa o ponteiro global de Round-Robin (1 a 60)
 same => n,Set(GLOBAL(VIVO_DISPATCH_IDX)=$[ (${GLOBAL(VIVO_DISPATCH_IDX)} % ${VIVO_TRUNK_COUNT}) + 1 ])
 same => n,Set(CHOSEN_IDX=${GLOBAL(VIVO_DISPATCH_IDX)})
 same => n,Set(TRUNK_NAME=vivo_${IF($[ ${CHOSEN_IDX} < 10 ]?0${CHOSEN_IDX}:${CHOSEN_IDX})})

 ; Verifica se o tronco está dentro do limite de canais simultâneos permitidos
 same => n,Set(CURRENT_USAGE=${GROUP_COUNT(${TRUNK_NAME}@vivo_trunks)})
 same => n,NoOp([AVALIACAO] Tronco: ${TRUNK_NAME} | Canais em uso: ${CURRENT_USAGE}/${VIVO_CHANNELS_PER_TRUNK} | Tentativa: ${TRY_COUNT})
 same => n,GotoIf($[ ${CURRENT_USAGE} >= ${VIVO_CHANNELS_PER_TRUNK} ]?next_trunk)

 ; Registra canal no grupo do tronco selecionado
 same => n,Set(GROUP(vivo_trunks)=${TRUNK_NAME})
 same => n,NoOp(>>> [DISP] Roteando para ${TRUNK_NAME} -> ${EXTEN} <<<)
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK_NAME},45,b(pre-dial-vivo^s^1(${TRUNK_NAME})))

 ; Se o canal estiver indisponível ou congestionado, tenta o próximo tronco no anel
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?next_trunk)
 same => n,Hangup()

 same => n(all_busy),NoOp(!!! [ALERTA] TODOS OS 60 TRONCOS VIVO SATURADOS OU INDISPONIVEIS !!!)
 same => n,Hangup(17)

[from-vivo]
exten => _X.,1,NoOp(--- CHAMADA RECEBIDA DA VIVO: ${EXTEN} ---)
 same => n,Hangup()

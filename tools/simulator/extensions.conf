[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
BENCHMARK_SOUNDS_DIR=/var/lib/asterisk/sounds/benchmark

; ==============================================================================
; CONTEXTO PRINCIPAL DO SIMULADOR TELEFÔNICO (IP 38.242.219.186)
; Recebe chamadas de teste e mantém áudio em looping contínuo até hangup do usuário
; ==============================================================================
[simulator-player]
exten => _X.,1,NoOp(=== [ASTERISK SIMULATOR 38.x] CHAMADA RECEBIDA PARA: ${EXTEN} (Uniqueid: ${UNIQUEID}) ===)
 same => n,Answer()
 same => n,Set(CHANNEL(language)=pt_BR)
 ; Executa AGI que sorteia áudio do catálogo de benchmark e grava gabarito no SQLite/JSONL
 same => n,AGI(/var/lib/asterisk/sounds/benchmark/play_benchmark.py,${EXTEN},${UNIQUEID})
 ; Fallback para áudio padrão se a variável não vier preenchida pelo AGI
 same => n,Set(AUDIO_TO_PLAY=${IF($[ "${AUDIO_TO_PLAY}" != "" ]?${AUDIO_TO_PLAY}:${BENCHMARK_SOUNDS_DIR}/sim_01_human_alo)})
 same => n,NoOp(=== [SIMULADOR] Iniciando Reproducao em Looping: ${AUDIO_TO_PLAY} | Tipo: ${AUDIO_TYPE} ===)
 ; -----------------------------------------------------------------------------
 ; LOOPING CONTÍNUO: Mantém o áudio tocando repetidamente sem desligar a chamada.
 ; Garante que o teste valide o desligamento voluntário pelo USUÁRIO/OPERADOR.
 ; -----------------------------------------------------------------------------
 same => n(play_loop),Playback(${AUDIO_TO_PLAY})
 same => n,Wait(1)
 same => n,Goto(play_loop)
 same => n,Hangup()

; Tratamento de desligamento da chamada (captura métricas de duração)
exten => h,1,NoOp(=== [SIMULADOR] CHAMADA FINALIZADA PELO USUARIO/DISCADOR ===)
 same => n,NoOp(Canal: ${CHANNEL} | Duracao Total: ${CDR(duration)}s | Conversacao (Billsec): ${CDR(billsec)}s | Causa: ${HANGUPCAUSE})

; Redirecionamento de extensões genéricas ou não numéricas
exten => s,1,Goto(simulator-player,11999999999,1)
exten => failed,1,NoOp(=== [SIMULADOR] FALHA NA CONEXAO DA CHAMADA ===)

; Alias para compatibilidade com contexto from-dialer
[from-dialer]
exten => _X.,1,Goto(simulator-player,${EXTEN},1)
exten => s,1,Goto(simulator-player,11999999999,1)
